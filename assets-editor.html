<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>素材编辑器 · 小球角斗场</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  /* 编辑器自己的版式：左选素材 / 中间预览 / 右边旋钮。
     三个区块各自滚动，改一个数不用来回找位置。 */
  .ed-wrap { display: grid; grid-template-columns: 208px minmax(0, 1fr) 340px; gap: 14px; align-items: start; }
  @media (max-width: 1080px) { .ed-wrap { grid-template-columns: minmax(0, 1fr); } }
  .ed-list { max-height: 74vh; overflow: auto; }
  .ed-group { font-size: 11.5px; color: var(--muted); margin: 10px 0 4px; letter-spacing: .04em; }
  .ed-item {
    display: block; width: 100%; text-align: left; padding: 6px 9px; margin: 3px 0;
    border: 1px solid var(--line2); border-radius: 8px; background: #fff; cursor: pointer; font-size: 13px;
  }
  .ed-item:hover { background: var(--paper2); }
  .ed-item.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .ed-stage { background: var(--paper2); border: 1px solid var(--line2); border-radius: 10px; padding: 8px; }
  #edCanvas { display: block; width: 100%; background: #fdfcf7; border: 1px solid #d9d3c4; border-radius: 8px; }
  .ed-row { display: flex; align-items: center; gap: 8px; margin: 9px 0 2px; }
  .ed-row label { flex: 1; font-size: 12.5px; }
  .ed-row input[type=number] { width: 84px; padding: 4px 7px; border: 1px solid var(--line); border-radius: 7px; }
  .ed-row input[type=range] { width: 100%; }
  .ed-row input[type=color] { width: 46px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  .ed-val { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; min-width: 62px; text-align: right; }
  /* 数字字段：标签独占一行、数字框靠右，下面才是滑块 ——
     挤在一行时长标签会折成三行、数字框被挤到角落。 */
  .ed-field { margin: 10px 0 2px; padding: 2px 4px 2px 6px; border-left: 3px solid transparent; border-radius: 4px; }
  .ed-field.dirty { border-left-color: #f59e0b; background: #fffbeb; }
  .ed-head { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
  .ed-head > span { flex: 1; font-size: 12.5px; line-height: 1.35; }
  .ed-head input[type=number] { width: 82px; flex: none; padding: 4px 6px; border: 1px solid var(--line); border-radius: 7px; }
  .ed-field input[type=range] { width: 100%; }
  .ed-warn { color: #b45309; font-size: 11px; }
  .ed-dirty { color: #b45309; font-weight: 600; }
  .ed-ok { color: #15803d; font-weight: 600; }
  .ed-bad { color: var(--bad); font-weight: 600; }
  .ed-out { max-height: 26vh; overflow: auto; white-space: pre-wrap; }
  #edDirtyTop { font-size: 12.5px; margin-right: 4px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">素材编辑器<small>尺寸 / 透明度 / 光晕 / 判定 —— 改完一键写回 js/*.js</small></div>
      <div class="spacer"></div>
      <span id="edDirtyTop"></span>
      <button class="btn primary" id="edSaveTop">一键保存</button>
      <a class="btn" href="index.html">返回游戏</a>
    </div>

    <div class="ed-wrap">
      <div class="card ed-list" id="edList"></div>

      <div>
        <div class="card">
          <h3 id="edTitle">选择一个素材</h3>
          <p class="hint" id="edNote" style="margin:0 0 4px"></p>
          <p class="hint" id="edDragHint" style="margin:0 0 10px;color:#0e7490"></p>
          <div class="ed-stage">
            <canvas id="edCanvas" width="720" height="440"></canvas>
          </div>
          <div class="btnrow" style="margin-top:8px">
            <label class="hint" style="display:flex;gap:6px;align-items:center">
              <input type="checkbox" id="edPulse" checked> 预览呼吸动画
            </label>
            <label class="hint" style="display:flex;gap:6px;align-items:center">
              <input type="checkbox" id="edRing" checked> 显示判定范围 / 参考尺寸
            </label>
            <label class="hint" style="display:flex;gap:6px;align-items:center">
              <input type="checkbox" id="edGrid" checked> 显示网格
            </label>
          </div>
        </div>
      </div>

      <div>
        <div class="card">
          <h3>参数</h3>
          <p class="hint" style="margin:0 0 6px" id="edGroupHint"></p>
          <div id="edFields"></div>
          <div class="btnrow" style="margin-top:12px">
            <button class="btn primary" id="edSave">一键保存</button>
            <button class="btn" id="edReset">放弃改动</button>
            <button class="btn sm" id="edCopy">复制改动</button>
          </div>
          <div id="edStatus" class="hint" style="margin-top:8px"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/ui-assets.js"></script>
</body>
</html>
